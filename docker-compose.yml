services:
  mysql_retencao:
    image: mysql:8.0
    container_name: mysql_retencao
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - retencao_db_data:/var/lib/mysql
    networks:
      - retencao_net

  node_retencao:
    build: .
    container_name: node_retencao
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - mysql_retencao
    networks:
      - retencao_net

  # Gateway de WhatsApp (não oficial) usado pela tela /whatsapp. Sem porta
  # publicada e fora do tunnel: só o node_retencao fala com ele, pela rede interna
  # (http://openwa_retencao:2785/api). Não tem imagem publicada — é construído a
  # partir do repositório, na versão fixada em OPENWA_VERSION.
  # No primeiro start a chave admin sai no log e em /app/data/.api-key; com ela,
  # crie uma chave "operator" e coloque em OPENWA_API_KEY no .env.
  openwa_retencao:
    build: https://github.com/rmyndharis/OpenWA.git#${OPENWA_VERSION:-v0.23.4}
    container_name: openwa_retencao
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      NODE_ENV: production
      # whatsapp-web.js abre um Chromium por número conectado (~300-500 MB cada),
      # mas imita o WhatsApp Web de verdade — menor risco de bloqueio que o Baileys.
      ENGINE_TYPE: whatsapp-web.js
      DATABASE_TYPE: sqlite
      AUTO_START_SESSIONS: "true"
      # Versão do WhatsApp Web usada pelo motor. Vazio = o OpenWA escolhe uma versão
      # "conhecida" num registro de terceiros; "off" = usa a versão atual do próprio
      # WhatsApp. Trocar pra "off" é a primeira coisa a tentar se o número conecta mas
      # não responde (erro "sendIq called before startComms" ou checagem travando).
      WWEBJS_WEB_VERSION: ${WWEBJS_WEB_VERSION:-}
      # Tempo pro WhatsApp Web terminar de carregar (padrão do OpenWA: 30000 ms).
      # Servidor lento/com pouca memória precisa de mais.
      WWEBJS_AUTH_TIMEOUT_MS: ${WWEBJS_AUTH_TIMEOUT_MS:-120000}
    volumes:
      # Sessões conectadas (sobrevivem a rebuild — sem isso todo mundo teria que
      # ler o QR code de novo a cada deploy) e a chave admin gerada.
      - openwa_data:/app/data
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    networks:
      - retencao_net

  cloudflared_retencao:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_retencao
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - node_retencao
    networks:
      - retencao_net
    profiles:
      - tunnel
networks:
  retencao_net:
    driver: bridge

volumes:
  retencao_db_data:
  openwa_data:
